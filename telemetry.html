<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Telemetry · The Pit Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #0a0a0a;
    --paper: #f2ece0;
    --racing: #e10600;
    --rule: rgba(242,236,224,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--carbon); color: var(--paper);
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 14px 24px; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    background: #0d0d0d;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
  .header-title em { color: var(--racing); font-style: italic; }
  .back-btn {
    color: var(--paper); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; border: 1px solid var(--rule); padding: 6px 12px;
  }
  .back-btn:hover { background: var(--paper); color: var(--carbon); }
  
  .layout { display: flex; flex: 1; overflow: hidden; }
  
  /* Layout Adjusted: Map takes less width, Table takes more space */
  .map-container {
    flex: 1.1; position: relative; border-right: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #141414 0%, #0a0a0a 100%);
    padding: 20px;
  }
  #trackSvg { width: 95%; height: 95%; transform: rotate(-90deg); }
  
  /* Crisp, scaled-down track lines */
  .track-path { 
    fill: none; 
    stroke: rgba(242,236,224,0.2); 
    stroke-width: 80; /* Reduced from 400 for a sharper look */
    stroke-linecap: round; 
    stroke-linejoin: round; 
  }
  
  /* Smooth refresh transitions matching the 3s polling loop exactly */
  .car-dot { 
    transition: cx 3s linear, cy 3s linear; 
  }
  .car-label { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 140px; /* Scaled down text sizing */
    fill: #fff; 
    font-weight: bold; 
    pointer-events: none; 
    transition: x 3s linear, y 3s linear;
    text-shadow: 1px 1px 2px #000;
  }

  .data-container { flex: 1.4; display: flex; flex-direction: column; background: #0d0d0d; }
  .data-header {
    padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; border-bottom: 1px solid var(--rule);
    color: rgba(242,236,224,0.5);
    background: #111;
  }
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: 12px; }
  th { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(242,236,224,0.5); font-weight: normal; position: sticky; top: 0; background: #111; z-index: 10;}
  .td-pos { font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--racing); }
  .td-driver { font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .td-time { font-family: 'JetBrains Mono', monospace; text-align: right; }
  
  .status-bar {
    padding: 6px 16px; background: var(--racing); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
    display: flex; justify-content: space-between; transition: background 0.3s;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-title">Live <em>Telemetry</em></div>
  <a href="/index.html" class="back-btn">← RETURN TO PIT WALL</a>
</header>

<div class="layout">
  <div class="map-container">
    <svg id="trackSvg" viewBox="0 0 10000 10000">
      <path id="trackPath" class="track-path" d=""></path>
      <g id="carsLayer"></g>
    </svg>
  </div>
  
  <div class="data-container">
    <div class="data-header">Live Timing Tower</div>
    <div class="table-wrap">
      <table id="timingTable">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th style="text-align:right;">Last Lap</th>
            <th style="text-align:right;">Interval</th>
          </tr>
        </thead>
        <tbody id="timingBody">
          <tr><td colspan="4" style="text-align:center; opacity:0.5; padding-top:24px;">Awaiting telemetry state...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <span id="connStatus">CONNECTING TO PROXY...</span>
  <span id="sessionInfo">AWAITING DATA</span>
</div>

<script>
const API_PROXY = '/api/telemetry';

let minX = Infinity, maxX = -Infinity;
let minY = Infinity, maxY = -Infinity;
let trackScale = 1, offsetX = 0, offsetY = 0;
let isPolling = false;

const teamColors = {
  1: '#3671C6', 11: '#3671C6', 44: '#27F4D2', 63: '#27F4D2',
  16: '#E8002D', 55: '#E8002D', 4: '#FF8000', 81: '#FF8000',
  14: '#229971', 18: '#229971', 10: '#0093CC', 31: '#0093CC',
  23: '#64C4FF', 2: '#64C4FF', 22: '#6692FF', 3: '#6692FF',
  77: '#00877C', 24: '#00877C', 20: '#B6BABD', 27: '#B6BABD'
};

function scaleX(x) { return offsetX + ((x - minX) * trackScale); }
function scaleY(y) { return offsetY + ((y - minY) * trackScale); }

async function initTelemetry() {
  const statusEl = document.getElementById('connStatus');
  const statusBar = document.getElementById('statusBar');
  statusEl.textContent = 'FETCHING SESSION STATE...';
  
  try {
    const sessionRes = await fetch(`${API_PROXY}?endpoint=sessions&session_key=latest`);
    const sessionData = await sessionRes.json();
    
    let isLive = true;
    if (sessionData && sessionData.length > 0) {
      const session = sessionData[0];
      const endTime = new Date(session.date_end);
      if (Date.now() > endTime.getTime()) {
        isLive = false;
      }
      document.getElementById('sessionInfo').textContent = `${session.session_name.toUpperCase()} · ${session.country_name.toUpperCase()}`;
    }

    statusEl.textContent = 'GENERATING CIRCUIT MAP...';
    
    // FIX: Removed driver_number=1 constraint so it reliably pulls map data from whatever telemetry is present
    const locRes = await fetch(`${API_PROXY}?endpoint=location&session_key=latest`);
    const locData = await locRes.json();
    
    if (!locData || locData.length === 0 || locData.error) {
      throw new Error('No track telemetry data available.');
    }

    // Process coordinates safely up to a clean sample size
    const samplePoints = locData.slice(0, 1500);
    samplePoints.forEach(pt => {
      if (pt.x < minX) minX = pt.x;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.y > maxY) maxY = pt.y;
    });

    const trackWidth = maxX - minX || 1;
    const trackHeight = maxY - minY || 1;
    const canvasSize = 8500; 
    const padding = 750;
    
    trackScale = Math.min(canvasSize / trackWidth, canvasSize / trackHeight);
    offsetX = padding + (canvasSize - (trackWidth * trackScale)) / 2;
    offsetY = padding + (canvasSize - (trackHeight * trackScale)) / 2;

    const pathEl = document.getElementById('trackPath');
    let d = `M ${scaleX(samplePoints[0].x)} ${scaleY(samplePoints[0].y)} `;
    for(let i = 1; i < samplePoints.length; i += 5) { 
        d += `L ${scaleX(samplePoints[i].x)} ${scaleY(samplePoints[i].y)} `;
    }
    d += 'Z';
    pathEl.setAttribute('d', d);

    if (!isLive) {
       statusEl.textContent = 'OFFLINE · SESSION COMPLETED';
       statusBar.style.background = '#222';
       renderOfflineTable();
       return;
    }

    statusEl.textContent = 'CONNECTED · LIVE TELEMETRY STREAM ACTIVE';
    statusBar.style.background = 'var(--racing)';
    
    isPolling = true;
    pollCarPositions();
    pollTimingData();
    
    // Continuous execution loops
    setInterval(pollCarPositions, 3000); 
    setInterval(pollTimingData, 6000);  

  } catch (error) {
    statusEl.textContent = 'ERROR INITIATING TELEMETRY FEED';
    statusBar.style.background = '#444';
    console.error(error);
  }
}

async function pollCarPositions() {
  if (!isPolling) return;
  try {
    // Lookup structural changes from the past 10 seconds to account for slight latency ingestion windows
    const timeString = new Date(Date.now() - 10000).toISOString();
    const res = await fetch(`${API_PROXY}?endpoint=location&session_key=latest&date>${timeString}`);
    const data = await res.json();
    
    if (!Array.isArray(data)) return;

    const latestPos = {};
    data.forEach(pt => { latestPos[pt.driver_number] = pt; });

    const layer = document.getElementById('carsLayer');
    
    Object.values(latestPos).forEach(pt => {
      const sx = scaleX(pt.x);
      const sy = scaleY(pt.y);
      const color = teamColors[pt.driver_number] || '#ffffff';

      let circle = document.getElementById(`car-${pt.driver_number}`);
      let label = document.getElementById(`label-${pt.driver_number}`);

      if (!circle) {
        circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.id = `car-${pt.driver_number}`;
        circle.setAttribute('r', '60'); // Reduced from 200 for crispness
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#000');
        circle.setAttribute('stroke-width', '15');
        circle.classList.add('car-dot');
        layer.appendChild(circle);

        label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.id = `label-${pt.driver_number}`;
        label.textContent = pt.driver_number;
        label.classList.add('car-label');
        layer.appendChild(label);
      }

      circle.setAttribute('cx', sx);
      circle.setAttribute('cy', sy);
      label.setAttribute('x', sx + 90); // Adjusted offsets for cleaner rendering
      label.setAttribute('y', sy + 50);
    });
  } catch (e) {
    console.warn("Location packet refresh skipped", e);
  }
}

async function pollTimingData() {
  if (!isPolling) return;
  try {
    // FIX: Request only the most recent snapshots using optimized query windows to prevent huge payload sizes
    const [posRes, intRes, lapsRes] = await Promise.all([
      fetch(`${API_PROXY}?endpoint=position&session_key=latest`),
      fetch(`${API_PROXY}?endpoint=intervals&session_key=latest`),
      fetch(`${API_PROXY}?endpoint=laps&session_key=latest`)
    ]);

    const posData = await posRes.json();
    const intData = await intRes.json();
    const lapsData = await lapsRes.json();

    if(!Array.isArray(posData)) return;

    const driverStats = {};
    
    // Safely parse out the structural endpoints map matching the current data states
    posData.forEach(p => { driverStats[p.driver_number] = { pos: p.position }; });
    
    if (Array.isArray(intData)) {
      intData.forEach(i => { if(driverStats[i.driver_number]) driverStats[i.driver_number].interval = i.interval; });
    }
    if (Array.isArray(lapsData)) {
      lapsData.forEach(l => { 
        if(driverStats[l.driver_number] && l.lap_duration) {
          driverStats[l.driver_number].lap_time = l.lap_duration; 
        }
      });
    }

    const sortedDrivers = Object.keys(driverStats)
      .map(num => ({ num, ...driverStats[num] }))
      .sort((a, b) => (a.pos || 99) - (b.pos || 99));

    if(sortedDrivers.length === 0) return;

    const tbody = document.getElementById('timingBody');
    tbody.innerHTML = sortedDrivers.map(d => `
      <tr>
        <td class="td-pos">${d.pos ? 'P' + d.pos : '-'}</td>
        <td class="td-driver">#${d.num}</td>
        <td class="td-time">${d.lap_time ? formatLapTime(d.lap_time) : 'No Time'}</td>
        <td class="td-time">${d.interval !== undefined && d.interval !== null ? '+' + d.interval.toFixed(3) : 'Leader'}</td>
      </tr>
    `).join('');

  } catch (e) {
    console.warn("Timing metrics ingestion dropped", e);
  }
}

function formatLapTime(timeInSeconds) {
  if(!timeInSeconds) return 'In Pits';
  const mins = Math.floor(timeInSeconds / 60);
  const secs = (timeInSeconds % 60).toFixed(3);
  return mins > 0 ? `${mins}:${secs.padStart(6, '0')}` : secs;
}

function renderOfflineTable() {
  document.getElementById('timingBody').innerHTML = `
    <tr>
      <td colspan="4" style="text-align:center; padding: 60px 20px; color:rgba(242,236,224,0.4); font-family:'JetBrains Mono', monospace;">
        <div style="font-size:18px; color:#fff; margin-bottom:12px;">SESSION COMPLETED</div>
        Live streaming feeds are available during active track operations.
      </td>
    </tr>`;
}

initTelemetry();
</script>
</body>
</html>
