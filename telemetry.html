<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Telemetry · The Pit Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #0a0a0a;
    --paper: #f2ece0;
    --racing: #e10600;
    --rule: rgba(242,236,224,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--carbon); color: var(--paper);
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 16px 24px; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
  .header-title em { color: var(--racing); font-style: italic; }
  .back-btn {
    color: var(--paper); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; border: 1px solid var(--rule); padding: 6px 12px;
  }
  .back-btn:hover { background: var(--paper); color: var(--carbon); }
  
  .layout { display: flex; flex: 1; overflow: hidden; }
  
  /* Track Map Container */
  .map-container {
    flex: 1.5; position: relative; border-right: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
  }
  #trackSvg { width: 90%; height: 90%; transform: rotate(-90deg); /* Adjust orientation */ }
  .track-path { fill: none; stroke: rgba(242,236,224,0.15); stroke-width: 400; stroke-linecap: round; stroke-linejoin: round; }
  .car-dot { transition: cx 1s linear, cy 1s linear; }
  .car-label { font-family: 'JetBrains Mono', monospace; font-size: 400px; fill: #fff; font-weight: bold; pointer-events: none; transition: x 1s linear, y 1s linear; }

  /* Telemetry Table Container */
  .data-container { flex: 1; display: flex; flex-direction: column; background: #111; }
  .data-header {
    padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; border-bottom: 1px solid var(--rule);
    color: rgba(242,236,224,0.5);
  }
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: 13px; }
  th { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(242,236,224,0.5); font-weight: normal; position: sticky; top: 0; background: #111; z-index: 10;}
  .td-pos { font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--racing); }
  .td-driver { font-weight: 600; }
  .td-time { font-family: 'JetBrains Mono', monospace; text-align: right; }
  
  .status-bar {
    padding: 8px 16px; background: var(--racing); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-title">Live <em>Telemetry</em></div>
  <a href="/index.html" class="back-btn">← RETURN TO PIT WALL</a>
</header>

<div class="layout">
  <div class="map-container">
    <svg id="trackSvg" viewBox="0 0 10000 10000">
      <path id="trackPath" class="track-path" d=""></path>
      <g id="carsLayer"></g>
    </svg>
  </div>
  
  <div class="data-container">
    <div class="data-header">Live Timing Tower</div>
    <div class="table-wrap">
      <table id="timingTable">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th style="text-align:right;">Last Lap</th>
            <th style="text-align:right;">Interval</th>
          </tr>
        </thead>
        <tbody id="timingBody">
          <tr><td colspan="4" style="text-align:center; opacity:0.5;">Awaiting telemetry...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="connStatus">CONNECTING TO OPENF1...</span>
  <span id="sessionInfo">AWAITING DATA</span>
</div>

<script>
    // OpenF1 Public Endpoints
const API_BASE = 'https://api.openf1.org/v1';

let minX = Infinity, maxX = -Infinity;
let minY = Infinity, maxY = -Infinity;
let trackScale = 1, offsetX = 0, offsetY = 0;

const teamColors = {
  1: '#3671C6', 11: '#3671C6', // Red Bull
  44: '#27F4D2', 63: '#27F4D2', // Mercedes
  16: '#E8002D', 55: '#E8002D', // Ferrari
  4: '#FF8000', 81: '#FF8000', // McLaren
  14: '#229971', 18: '#229971', // Aston Martin
  10: '#0093CC', 31: '#0093CC', // Alpine
  23: '#64C4FF', 2: '#64C4FF', // Williams
  22: '#6692FF', 3: '#6692FF', // RB
  77: '#00877C', 24: '#00877C', // Kick Sauber
  20: '#B6BABD', 27: '#B6BABD'  // Haas
};

async function initTelemetry() {
  const statusEl = document.getElementById('connStatus');
  statusEl.textContent = 'FETCHING SESSION STATE...';
  
  try {
    // 1. Check if the session is currently active
    const sessionRes = await fetch(`${API_BASE}/sessions?session_key=latest`);
    const sessionData = await sessionRes.json();
    
    let isLive = true;
    if (sessionData && sessionData.length > 0) {
      const session = sessionData[0];
      const endTime = new Date(session.date_end);
      
      // If current time is past the scheduled end time, it is offline
      if (Date.now() > endTime.getTime()) {
        isLive = false;
      }
      
      document.getElementById('sessionInfo').textContent = `${session.session_name.toUpperCase()} · ${session.country_name.toUpperCase()}`;
    }

    // 2. Fetch Location Data to Draw the Track
    statusEl.textContent = 'MAPPING CIRCUIT...';
    const locRes = await fetch(`${API_BASE}/location?session_key=latest&driver_number=1`);
    const locData = await locRes.json();
    
    if (!locData || locData.length === 0) {
      statusEl.textContent = 'NO TELEMETRY DATA FOUND';
      return;
    }

    // Calculate Bounding Box
    locData.forEach(pt => {
      if (pt.x < minX) minX = pt.x;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.y > maxY) maxY = pt.y;
    });

    // THE FIX: Uniform Scaling to prevent map distortion
    const trackWidth = maxX - minX;
    const trackHeight = maxY - minY;
    const canvasSize = 8000; 
    const padding = 1000;
    
    trackScale = Math.min(canvasSize / trackWidth, canvasSize / trackHeight);
    offsetX = padding + (canvasSize - (trackWidth * trackScale)) / 2;
    offsetY = padding + (canvasSize - (trackHeight * trackScale)) / 2;

    // Draw the track path (sampling every 10th point to keep SVG fast)
    const pathEl = document.getElementById('trackPath');
    let d = `M ${scaleX(locData[0].x)} ${scaleY(locData[0].y)} `;
    const maxPoints = Math.min(locData.length, 3000); // 3000 points is enough for a full lap outline
    for(let i=1; i < maxPoints; i+=10) { 
        d += `L ${scaleX(locData[i].x)} ${scaleY(locData[i].y)} `;
    }
    d += 'Z';
    pathEl.setAttribute('d', d);

    // 3. Fallback UI if not live
    if (!isLive) {
       statusEl.textContent = 'OFFLINE · NO ACTIVE SESSION';
       statusEl.style.background = '#222';
       
       document.getElementById('timingBody').innerHTML = `
         <tr>
           <td colspan="4" style="text-align:center; padding: 60px 20px; color:rgba(242,236,224,0.4); font-family:'JetBrains Mono', monospace;">
             <div style="font-size:24px; color:#fff; margin-bottom:12px;">SESSION CONCLUDED</div>
             Live telemetry will resume<br>during the next track session.
           </td>
         </tr>`;
       
       // Add an offline watermark to the SVG map
       const layer = document.getElementById('carsLayer');
       const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
       text.setAttribute('x', '5000');
       text.setAttribute('y', '5000');
       text.setAttribute('text-anchor', 'middle');
       text.setAttribute('fill', 'rgba(255,255,255,0.05)');
       text.setAttribute('font-size', '600px');
       text.setAttribute('font-family', 'Inter, sans-serif');
       text.setAttribute('font-weight', 'bold');
       text.textContent = "OFFLINE";
       layer.appendChild(text);
       return;
    }

    statusEl.textContent = 'CONNECTED · LIVE TELEMETRY ACTIVE';
    
    // 4. Start the Polling Loops ONLY if live
    pollCarPositions();
    pollTimingData();
    setInterval(pollCarPositions, 3000); 
    setInterval(pollTimingData, 10000);  

  } catch (error) {
    statusEl.textContent = 'ERROR CONNECTING TO OPENF1';
    console.error(error);
  }
}

// Math to map real coordinates to the 10000x10000 SVG Canvas uniformly
function scaleX(x) {
  return offsetX + ((x - minX) * trackScale);
}
function scaleY(y) {
  return offsetY + ((y - minY) * trackScale);
}

// Fetch the very latest X,Y coordinate for every driver on track
async function pollCarPositions() {
  try {
    const dateObj = new Date(Date.now() - 5000);
    const timeString = dateObj.toISOString();
    
    const res = await fetch(`${API_BASE}/location?session_key=latest&date>${timeString}`);
    const data = await res.json();
    
    const latestPos = {};
    data.forEach(pt => {
      latestPos[pt.driver_number] = pt; 
    });

    const layer = document.getElementById('carsLayer');
    
    Object.values(latestPos).forEach(pt => {
      const sx = scaleX(pt.x);
      const sy = scaleY(pt.y);
      const color = teamColors[pt.driver_number] || '#ffffff';

      let circle = document.getElementById(`car-${pt.driver_number}`);
      let label = document.getElementById(`label-${pt.driver_number}`);

      if (!circle) {
        circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.id = `car-${pt.driver_number}`;
        circle.setAttribute('r', '200');
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#000');
        circle.setAttribute('stroke-width', '50');
        circle.classList.add('car-dot');
        layer.appendChild(circle);

        label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.id = `label-${pt.driver_number}`;
        label.textContent = pt.driver_number;
        label.classList.add('car-label');
        layer.appendChild(label);
      }

      circle.setAttribute('cx', sx);
      circle.setAttribute('cy', sy);
      label.setAttribute('x', sx + 250);
      label.setAttribute('y', sy + 150);
    });
  } catch (e) {
    console.log("Telemetry poll failed", e);
  }
}

// Fetch the current standings, intervals, and last lap times
async function pollTimingData() {
  try {
    const [posRes, intRes, lapsRes] = await Promise.all([
      fetch(`${API_BASE}/position?session_key=latest`),
      fetch(`${API_BASE}/intervals?session_key=latest`),
      fetch(`${API_BASE}/laps?session_key=latest`)
    ]);

    const posData = await posRes.json();
    const intData = await intRes.json();
    const lapsData = await lapsRes.json();

    const driverStats = {};
    
    posData.forEach(p => { driverStats[p.driver_number] = { pos: p.position }; });
    intData.forEach(i => { if(driverStats[i.driver_number]) driverStats[i.driver_number].interval = i.interval; });
    lapsData.forEach(l => { if(driverStats[l.driver_number]) driverStats[l.driver_number].lap_time = l.lap_duration; });

    const sortedDrivers = Object.keys(driverStats)
      .map(num => ({ num, ...driverStats[num] }))
      .sort((a, b) => a.pos - b.pos);

    const tbody = document.getElementById('timingBody');
    tbody.innerHTML = sortedDrivers.map(d => `
      <tr>
        <td class="td-pos">P${d.pos || '-'}</td>
        <td class="td-driver">#${d.num}</td>
        <td class="td-time">${d.lap_time ? d.lap_time.toFixed(3) : 'In Pits'}</td>
        <td class="td-time">${d.interval ? '+' + d.interval.toFixed(3) : 'Leader'}</td>
      </tr>
    `).join('');

  } catch (e) {
    console.log("Timing poll failed", e);
  }
}

// Start the engine
initTelemetry();
</script>
</body>
</html>
