<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Timing · The Pit Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #0a0a0a;
    --paper: #f2ece0;
    --racing: #e10600;
    --rule: rgba(242,236,224,0.1);
    --muted: rgba(242,236,224,0.48);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--carbon); color: var(--paper);
    font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
  }
  .header {
    padding: 14px 24px; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center; background: #0d0d0d;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
  .header-title em { color: var(--racing); font-style: italic; }
  .back-btn {
    color: var(--paper); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; border: 1px solid var(--rule); padding: 6px 12px;
  }
  .back-btn:hover { background: var(--paper); color: var(--carbon); }
  .layout { flex: 1; width: 100%; max-width: 1500px; margin: 0 auto; border-inline: 1px solid var(--rule); background: #0d0d0d; }
  .data-header {
    padding: 14px 18px; display: flex; justify-content: space-between; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); background: #111;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 920px; border-collapse: collapse; text-align: left; }
  th, td { padding: 13px 16px; border-bottom: 1px solid var(--rule); font-size: 13px; }
  th {
    position: sticky; top: 0; z-index: 2; background: #111; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: normal; letter-spacing: 0.08em;
  }
  tbody tr:hover { background: rgba(242,236,224,0.035); }
  .td-pos { width: 58px; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
  .td-driver { min-width: 210px; font-weight: 600; border-left: 4px solid var(--team-color, #fff); }
  .driver-code { font-family: 'JetBrains Mono', monospace; }
  .driver-name { margin-left: 8px; color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
  .td-time { text-align: right; font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .td-best { color: #d894ff; }
  .tyre-pill {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 50%; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #000;
  }
  .tyre-soft { background: #ff4d4d; color: #fff; }
  .tyre-medium { background: #ffd700; }
  .tyre-hard { background: #fff; border: 2px solid #ccc; }
  .tyre-intermediate { background: #00cc66; color: #fff; }
  .tyre-wet { background: #3385ff; color: #fff; }
  .tyre-unknown { background: #444; color: #aaa; }
  .empty { padding: 72px 20px; text-align: center; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .status-bar {
    padding: 7px 16px; background: var(--racing); color: #fff; display: flex; justify-content: space-between; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
  }
  @media (max-width: 700px) {
    .header { padding: 12px; }
    .driver-name { display: none; }
    .data-header, .status-bar { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-title">Live <em>Timing</em></div>
  <a href="/index.html" class="back-btn">RETURN TO PIT WALL</a>
</header>

<main class="layout">
  <div class="data-header">
    <span>Session Timing Tower</span>
    <span id="sessionInfo">Awaiting session data</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Driver</th>
          <th>Tyre</th>
          <th style="text-align:right;">Lap</th>
          <th style="text-align:right;">Last Lap</th>
          <th style="text-align:right;">Best Lap</th>
          <th style="text-align:right;">Gap</th>
          <th style="text-align:right;">Interval</th>
        </tr>
      </thead>
      <tbody id="timingBody">
        <tr><td colspan="8" class="empty">Establishing timing feed...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="status-bar" id="statusBar">
  <span id="connStatus">CONNECTING TO OPENF1...</span>
  <span id="refreshStatus">WAITING</span>
</div>

<script>
const API_PROXY = '/api/telemetry';
const POLL_MS = 6000;
const driverDictionary = {};
let sessionIsLive = false;
let pollTimer = null;

function latestWindow() {
  return new Date(Date.now() - 3 * 60 * 1000).toISOString();
}

function formatLapTime(seconds) {
  const value = Number(seconds);
  if (!Number.isFinite(value) || value <= 0) return '—';
  const mins = Math.floor(value / 60);
  const secs = (value % 60).toFixed(3);
  return mins ? `${mins}:${secs.padStart(6, '0')}` : secs;
}

function formatDelta(value, leaderLabel) {
  if (value == null || value === '') return leaderLabel;
  if (typeof value === 'number') return value === 0 ? leaderLabel : `+${value.toFixed(3)}`;
  const numeric = Number(value);
  if (Number.isFinite(numeric)) return numeric === 0 ? leaderLabel : `+${numeric.toFixed(3)}`;
  return String(value).toUpperCase();
}

function renderRows(rows) {
  const body = document.getElementById('timingBody');
  if (!Array.isArray(rows) || !rows.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">Timing data is not available for this session yet.</td></tr>';
    return;
  }

  rows.sort((a, b) => (a.position || 999) - (b.position || 999));
  body.innerHTML = rows.map(row => {
    const meta = driverDictionary[row.driver_number] || {};
    const compound = String(row.compound || 'unknown').toLowerCase();
    const tyreClass = ['soft', 'medium', 'hard', 'intermediate', 'wet'].includes(compound) ? compound : 'unknown';
    const tyreLabel = tyreClass === 'unknown' ? '?' : tyreClass.charAt(0).toUpperCase();
    return `<tr>
      <td class="td-pos">${row.position || '—'}</td>
      <td class="td-driver" style="--team-color:${meta.color || '#fff'}">
        <span class="driver-code">${meta.acronym || '#' + row.driver_number}</span>
        <span class="driver-name">${meta.name || ''}</span>
      </td>
      <td><span class="tyre-pill tyre-${tyreClass}" title="${compound}">${tyreLabel}</span></td>
      <td class="td-time">${row.lap_number || '—'}</td>
      <td class="td-time">${formatLapTime(row.last_lap)}</td>
      <td class="td-time td-best">${formatLapTime(row.best_lap)}</td>
      <td class="td-time">${formatDelta(row.gap_to_leader, 'LEADER')}</td>
      <td class="td-time">${formatDelta(row.interval, '—')}</td>
    </tr>`;
  }).join('');
}

async function pollTiming() {
  const refresh = document.getElementById('refreshStatus');
  try {
    const query = new URLSearchParams({ endpoint: 'timing', session_key: 'latest' });
    if (sessionIsLive) query.set('date>=', latestWindow());
    const response = await fetch(`${API_PROXY}?${query}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    renderRows(await response.json());
    refresh.textContent = `UPDATED ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    refresh.textContent = 'REFRESH FAILED';
    console.warn('Timing refresh failed:', error);
  }
}

async function initTelemetry() {
  const status = document.getElementById('connStatus');
  const statusBar = document.getElementById('statusBar');
  try {
    const [sessionResponse, driversResponse] = await Promise.all([
      fetch(`${API_PROXY}?endpoint=sessions&session_key=latest`),
      fetch(`${API_PROXY}?endpoint=drivers&session_key=latest`)
    ]);
    if (!sessionResponse.ok || !driversResponse.ok) throw new Error('Session setup failed');

    const sessions = await sessionResponse.json();
    const drivers = await driversResponse.json();
    const session = Array.isArray(sessions) ? sessions[0] : null;

    for (const driver of Array.isArray(drivers) ? drivers : []) {
      if (driver?.driver_number == null) continue;
      driverDictionary[driver.driver_number] = {
        acronym: driver.name_acronym || String(driver.last_name || '').slice(0, 3).toUpperCase(),
        name: driver.full_name || driver.last_name || '',
        color: `#${driver.team_colour || 'ffffff'}`
      };
    }

    if (session) {
      document.getElementById('sessionInfo').textContent = `${session.session_name} · ${session.country_name}`;
      sessionIsLive = Date.now() >= Date.parse(session.date_start) && Date.now() <= Date.parse(session.date_end);
    }

    await pollTiming();
    status.textContent = sessionIsLive ? 'CONNECTED · LIVE TIMING ACTIVE' : 'LATEST SESSION · FINAL TIMING';
    statusBar.style.background = sessionIsLive ? 'var(--racing)' : '#292929';
    if (sessionIsLive) pollTimer = setInterval(pollTiming, POLL_MS);
  } catch (error) {
    status.textContent = 'TIMING FEED UNAVAILABLE';
    statusBar.style.background = '#444';
    console.error(error);
  }
}

initTelemetry();
</script>
</body>
</html>
