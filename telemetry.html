<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Telemetry · The Pit Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon: #0a0a0a;
    --paper: #f2ece0;
    --racing: #e10600;
    --rule: rgba(242,236,224,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--carbon); color: var(--paper);
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 14px 24px; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    background: #0d0d0d;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
  .header-title em { color: var(--racing); font-style: italic; }
  .back-btn {
    color: var(--paper); text-decoration: none; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; border: 1px solid var(--rule); padding: 6px 12px;
    transition: background 0.2s;
  }
  .back-btn:hover { background: var(--paper); color: var(--carbon); }
  
  .layout { display: flex; flex: 1; overflow: hidden; background: #0d0d0d; justify-content: center; }
  .data-container { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);}
  
  .data-header {
    padding: 16px 20px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; border-bottom: 1px solid var(--rule);
    color: rgba(242,236,224,0.5);
    background: #111;
  }
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 14px 20px; border-bottom: 1px solid var(--rule); font-size: 14px; }
  th { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(242,236,224,0.5); font-weight: normal; position: sticky; top: 0; background: #111; z-index: 10;}
  .td-pos { font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--paper); width: 60px; }
  .td-driver { font-weight: 600; font-family: 'Inter', sans-serif; font-size: 16px; }
  .td-time { font-family: 'JetBrains Mono', monospace; text-align: right; }
  
  .tyre-pill {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold;
    color: #000;
  }
  .tyre-soft { background: #ff4d4d; color: #fff; }
  .tyre-medium { background: #ffd700; }
  .tyre-hard { background: #fff; border: 2px solid #ccc; }
  .tyre-intermediate { background: #00cc66; color: #fff; }
  .tyre-wet { background: #3385ff; color: #fff; }
  .tyre-unknown { background: #444; color: #aaa; }

  .status-bar {
    padding: 8px 16px; background: var(--racing); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    display: flex; justify-content: space-between; transition: background 0.3s;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-title">Live <em>Telemetry</em></div>
  <a href="/index.html" class="back-btn">← RETURN TO PIT WALL</a>
</header>

<div class="layout">
  <div class="data-container">
    <div class="data-header">Timing Tower</div>
    <div class="table-wrap">
      <table id="timingTable">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Driver</th>
            <th>Tyre</th>
            <th style="text-align:right;">Last Lap</th>
            <th style="text-align:right;">Gap</th>
            <th style="text-align:right;">Interval</th>
          </tr>
        </thead>
        <tbody id="timingBody">
          <tr><td colspan="6" style="text-align:center; opacity:0.5; padding-top:40px;">Establishing telemetry handshake...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar">
  <span id="connStatus">CONNECTING TO SECURE PROXY...</span>
  <span id="sessionInfo">AWAITING DATA</span>
</div>

<script>
const API_PROXY = '/api/telemetry';
let isPolling = false;

window.driverStatsCache = {};
let driverDictionary = {};

function getRoundedTimeWindow(offsetSeconds) {
  const roundedMs = Math.floor(Date.now() / 5000) * 5000;
  return new Date(roundedMs - (offsetSeconds * 1000)).toISOString();
}

async function initTelemetry() {
  const statusEl = document.getElementById('connStatus');
  const statusBar = document.getElementById('statusBar');
  
  try {
    const sessionRes = await fetch(`${API_PROXY}?endpoint=sessions&session_key=latest`);
    const sessionData = await sessionRes.json();
    
    let isLive = true;
    if (sessionData && sessionData.length > 0) {
      const session = sessionData[0];
      const endTime = new Date(session.date_end);
      if (Date.now() > endTime.getTime()) isLive = false;
      document.getElementById('sessionInfo').textContent = `${session.session_name.toUpperCase()} · ${session.country_name.toUpperCase()}`;
    }

    statusEl.textContent = 'SYNCING DRIVER ROSTER...';
    const driversRes = await fetch(`${API_PROXY}?endpoint=drivers&session_key=latest`);
    const driversList = await driversRes.json();
    
    if (Array.isArray(driversList)) {
      driversList.forEach(d => {
        if (d.driver_number != null) {
          driverDictionary[d.driver_number] = {
            acronym: d.name_acronym || d.last_name.substring(0,3).toUpperCase(),
            name: d.last_name,
            color: '#' + (d.team_colour || 'ffffff')
          };
        }
      });
    }

    if (!isLive) {
       statusEl.textContent = 'OFFLINE · SESSION COMPLETED';
       statusBar.style.background = '#222';
       renderOfflineTable();
       return;
    }

    statusEl.textContent = 'CONNECTED · LIVE STREAM ACTIVE';
    statusBar.style.background = 'var(--racing)';
    
    isPolling = true;
    pollTimingData();
    setInterval(pollTimingData, 5000);  

  } catch (error) {
    statusEl.textContent = 'CONNECTION FAILED. CHECK LOGS.';
    statusBar.style.background = '#444';
    console.error(error);
  }
}

async function pollTimingData() {
  if (!isPolling) return;
  try {
    const timeWin = getRoundedTimeWindow(150); 
    const res = await fetch(`${API_PROXY}?endpoint=timing&session_key=latest&timeWindow=${timeWin}`);
    
    if (!res.ok) throw new Error('Timing fetch failed');
    const { pos, int, laps, stints } = await res.json();

    const driverStats = window.driverStatsCache;
    
    // THE FIX: Strict null checks prevent OpenF1 errors from creating "undefined" drivers
    if (Array.isArray(pos)) {
      pos.forEach(p => { 
        if (p == null || p.driver_number == null) return;
        if (!driverStats[p.driver_number]) driverStats[p.driver_number] = {};
        driverStats[p.driver_number].pos = p.position; 
      });
    }
    
    if (Array.isArray(int)) {
      int.forEach(i => { 
        if (i == null || i.driver_number == null) return;
        if (!driverStats[i.driver_number]) driverStats[i.driver_number] = {};
        driverStats[i.driver_number].interval = i.interval; 
        driverStats[i.driver_number].gap = i.gap_to_leader;
      });
    }

    if (Array.isArray(laps)) {
      laps.forEach(l => { 
        if (l == null || l.driver_number == null) return;
        if (!driverStats[l.driver_number]) driverStats[l.driver_number] = {};
        if (l.lap_duration) driverStats[l.driver_number].lap_time = l.lap_duration; 
      });
    }

    if (Array.isArray(stints)) {
      stints.sort((a,b) => (b.stint_number || 0) - (a.stint_number || 0));
      stints.forEach(s => {
        if (s == null || s.driver_number == null) return;
        if (!driverStats[s.driver_number]) driverStats[s.driver_number] = {};
        if (!driverStats[s.driver_number].stint_num || s.stint_number >= driverStats[s.driver_number].stint_num) {
          driverStats[s.driver_number].tyre = s.compound ? s.compound.toLowerCase() : 'unknown';
          driverStats[s.driver_number].stint_num = s.stint_number;
        }
      });
    }

    const sortedDrivers = Object.keys(driverStats)
      .map(num => ({ num, ...driverStats[num] }))
      .sort((a, b) => (a.pos || 99) - (b.pos || 99));

    if(sortedDrivers.length === 0) return;

    const tbody = document.getElementById('timingBody');
    tbody.innerHTML = sortedDrivers.map(d => {
      const meta = driverDictionary[d.num] || {};
      const dName = meta.name ? `${meta.acronym} <span style="opacity:0.4; font-size:11px; margin-left:8px;">${meta.name.toUpperCase()}</span>` : `#${d.num}`;
      
      const tyreCompound = d.tyre || 'unknown';
      const tyreLabel = tyreCompound !== 'unknown' ? tyreCompound.charAt(0).toUpperCase() : '?';

      return `
      <tr>
        <td class="td-pos">${d.pos || '-'}</td>
        <td class="td-driver" style="border-left: 4px solid ${meta.color || '#fff'}; padding-left:16px;">${dName}</td>
        <td><span class="tyre-pill tyre-${tyreCompound}">${tyreLabel}</span></td>
        <td class="td-time">${d.lap_time ? formatLapTime(d.lap_time) : 'In Pits'}</td>
        <td class="td-time">${d.gap !== undefined && d.gap !== null ? '+' + d.gap.toFixed(3) : 'LEADER'}</td>
        <td class="td-time">${d.interval !== undefined && d.interval !== null ? '+' + d.interval.toFixed(3) : '-'}</td>
      </tr>
      `;
    }).join('');

  } catch (e) {
    console.warn("Client-side timing ingestion skipped:", e);
  }
}

function formatLapTime(timeInSeconds) {
  if(!timeInSeconds) return 'In Pits';
  const mins = Math.floor(timeInSeconds / 60);
  const secs = (timeInSeconds % 60).toFixed(3);
  return mins > 0 ? `${mins}:${secs.padStart(6, '0')}` : secs;
}

function renderOfflineTable() {
  document.getElementById('timingBody').innerHTML = `
    <tr>
      <td colspan="6" style="text-align:center; padding: 80px 20px; color:rgba(242,236,224,0.4); font-family:'JetBrains Mono', monospace;">
        <div style="font-size:22px; color:#fff; margin-bottom:12px;">SESSION COMPLETED</div>
        Live timing tower will resume during the next active track operation.
      </td>
    </tr>`;
}

initTelemetry();
</script>
</body>
</html>
